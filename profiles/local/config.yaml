# Local execution.
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

cores: 16
printshellcmds: true
rerun-incomplete: true
keep-going: true
show-failed-logs: true
retries: 1
benchmark-extended: true

default-resources:          # fallback for trivial rules
  mem_mb: 2000
  runtime: 30

set-threads:                # capped at --cores
  indexing: 4
  gem_indexer: 52
  minibwa_index: 52
  bwamem3_index: 52
  split: 8
  mapping: 52
  mapping_minibwa: 52
  mapping_bwamem3: 52
  merge: 13
  bam_qc: 4
  bam_md5: 1
  get_coverage: 13
  contig_pools: 1
  calling: 4
  merge_chroms: 4
  gembs_extract: 16
  extract_signal: 8
  get_methylc: 8
