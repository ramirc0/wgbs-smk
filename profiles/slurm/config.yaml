executor: slurm
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

jobs: unlimited
# Job selection reruns once per timespan and stats every ready job's input on
# NFS. At 1s, a driver with more ready jobs than slots pins a login-node core.
max-jobs-per-timespan: 50/10s
# With jobs: unlimited the only cap is max-jobs-per-timespan, so the scheduler
# only orders that queue. Greedy starts big-input jobs first; give a small blocking rule `priority:`.
scheduler: greedy
# Mapping jobs each stream a sort spill to shared storage. Uncapped, they
# stalled nodes.
resources:
  - mapping_slots=64

slurm-efficiency-report: true
slurm-efficiency-report-path: logs/efficiency
slurm-efficiency-threshold: 0.8
slurm-init-seconds-before-status-checks: 10
# NODE_FAIL nodes join this list. An --exclude in slurm_extra would override it.
slurm-exclude-failed-nodes: z1014,z1024,z1056,z1060,z1062,z1072,z1081

default-resources:
  slurm_partition: 12hours
  runtime: 60m
  mem_mb: 4000
  slurm_extra: "--cpu-freq=High-High:Performance"

# SLURM allocates whole 2-thread cores, so an odd count gets one CPU more.
set-threads:
  indexing: 4
  gem_indexer: 52
  bwamem3_index: 52
  split: 8
  mapping: 12
  mapping_bwamem3: 12
  merge: 12
  bam_qc: 26
  bam_md5: 1
  bcf_md5: 1
  get_coverage: 26
  contig_pools: 1
  # bs_call's --threads only sizes its htslib I/O pools.
  calling: 4
  merge_chroms: 4
  gembs_extract: 32
  extract_signal: 8
  get_methylc: 8
  gather_qc: 8
  qc_figures: 8
  qc_report: 1

# From the 2026-10-10 ENCODE run (benchmarks/encode-validation/). Peaks, largest
# sample: gem_indexer 57 GB, mapping 34 GB at 26 threads, calling 1.2 GB,
# gembs_extract 6.7 GB, extract_signal 196 GB and get_methylc 205 GB before
# their rewrites.
set-resources:
  indexing:
    slurm_partition: 4hours
    mem_mb: 8000 * attempt
    runtime: 60m
  gem_indexer:
    # gem3-mapper is built for AVX-512 (x86-64-v4); cascadelake nodes have it.
    constraint: cascadelake
    mem_mb: 100000 * attempt
    runtime: 240m
  split:
    mem_mb: 8000 * attempt
    runtime: 720m
  mapping:
    constraint: cascadelake
    # A 585 M-pair sample takes about 11 h at 12 threads, too close to 12hours.
    slurm_partition: 5days
    # gem-mapper's 35 GB plus samtools sort's 768 MB per thread.
    mem_mb: 64000 * attempt
    runtime: 1440m
    mapping_slots: 1
  bwamem3_index:
    # About 12 bytes per base of the doubled seed text, four genome copies.
    mem_mb: 200000 * attempt
    runtime: 240m
  mapping_bwamem3:
    # bwa-mem3 runs on any node. cascadelake nodes are faster.
    constraint: cascadelake
    slurm_partition: 5days
    # bwa-mem3 peaks near 57 GB, plus samtools sort's 768 MB per thread.
    mem_mb: 80000 * attempt
    runtime: 2880m
    mapping_slots: 1
  merge:
    slurm_partition: 4hours
    mem_mb: 8000 * attempt
    runtime: 240m
  bam_qc:
    slurm_partition: 4hours
    mem_mb: 16000 * attempt
    runtime: 240m
  bam_md5:
    slurm_partition: 4hours
    mem_mb: 1000 * attempt
    runtime: 120m
  bcf_md5:
    slurm_partition: 4hours
    mem_mb: 1000 * attempt
    runtime: 120m
  get_coverage:
    slurm_partition: 4hours
    mem_mb: 64000 * attempt
    runtime: 240m
  contig_pools:
    slurm_partition: 4hours
    mem_mb: 1000 * attempt
    runtime: 30m
  calling:
    slurm_partition: 4hours
    mem_mb: 4000 * attempt
    runtime: 120m
  merge_chroms:
    slurm_partition: 4hours
    mem_mb: 4000 * attempt
    runtime: 120m
  gembs_extract:
    # mextr: 17.5 min on cascadelake, 31 on broadwell.
    constraint: cascadelake
    slurm_partition: 4hours
    mem_mb: 16000 * attempt
    runtime: 240m
  extract_signal:
    slurm_partition: 4hours
    mem_mb: 200000 * attempt
    runtime: 240m
  get_methylc:
    slurm_partition: 4hours
    mem_mb: 200000 * attempt
    runtime: 240m
  gather_qc:
    slurm_partition: 4hours
    mem_mb: 16000 * attempt
    runtime: 120m
  qc_figures:
    slurm_partition: 4hours
    mem_mb: 16000 * attempt
    runtime: 120m
  qc_report:
    slurm_partition: 4hours
    mem_mb: 16000 * attempt
    runtime: 60m

rerun-incomplete: true
keep-going: true
show-failed-logs: true
benchmark-extended: true
retries: 1
slurm-requeue: false
printshellcmds: true
latency-wait: 60
