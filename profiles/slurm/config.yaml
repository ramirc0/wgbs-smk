executor: slurm
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

jobs: 40
max-jobs-per-second: 5

slurm-efficiency-report: true
slurm-efficiency-report-path: logs/efficiency
slurm-efficiency-threshold: 0.8

default-resources:
  slurm_partition: 12hours
  runtime: 60m
  mem_mb: 4000
  slurm_extra: "--exclude=z[1024,1062] --cpu-freq=High-High:Performance"

set-threads:
  indexing: 4
  gem_indexer: 52
  split: 8
  mapping: 52
  merge: 13
  bam_qc: 26
  bam_md5: 1
  bcf_md5: 1
  get_coverage: 26
  contig_pools: 1
  # bs_call's --threads only sizes its htslib I/O pools.
  calling: 4
  merge_chroms: 4
  gembs_extract: 32
  extract_signal: 8
  get_methylc: 8

# From the 2026-10-10 ENCODE run (benchmarks/encode-validation/). Peaks, largest
# sample: gem_indexer 57 GB, mapping 34 GB at 26 threads, calling 1.2 GB,
# gembs_extract 6.7 GB, extract_signal 196 GB and get_methylc 205 GB before
# their rewrites.
set-resources:
  indexing:
    slurm_partition: 4hours
    mem_mb: 8000 * attempt
    runtime: 60m
  gem_indexer:
    # gem3-mapper is built for AVX-512 (x86-64-v4); cascadelake nodes have it.
    constraint: cascadelake
    mem_mb: 100000 * attempt
    runtime: 240m
  split:
    mem_mb: 8000 * attempt
    runtime: 720m
  mapping:
    constraint: cascadelake
    slurm_partition: 5days
    # gem-mapper plus samtools sort's 768 MB per thread.
    mem_mb: 160000 * attempt
    runtime: 2880m
  merge:
    slurm_partition: 4hours
    mem_mb: 8000 * attempt
    runtime: 240m
  bam_qc:
    slurm_partition: 4hours
    mem_mb: 16000 * attempt
    runtime: 240m
  bam_md5:
    slurm_partition: 4hours
    mem_mb: 1000 * attempt
    runtime: 120m
  bcf_md5:
    slurm_partition: 4hours
    mem_mb: 1000 * attempt
    runtime: 120m
  get_coverage:
    slurm_partition: 4hours
    mem_mb: 64000 * attempt
    runtime: 240m
  contig_pools:
    slurm_partition: 4hours
    mem_mb: 1000 * attempt
    runtime: 30m
  calling:
    slurm_partition: 4hours
    mem_mb: 4000 * attempt
    runtime: 120m
  merge_chroms:
    slurm_partition: 4hours
    mem_mb: 4000 * attempt
    runtime: 120m
  gembs_extract:
    slurm_partition: 4hours
    mem_mb: 16000 * attempt
    runtime: 240m
  extract_signal:
    slurm_partition: 4hours
    mem_mb: 200000 * attempt
    runtime: 240m
  get_methylc:
    slurm_partition: 4hours
    mem_mb: 200000 * attempt
    runtime: 240m

rerun-incomplete: true
keep-going: true
show-failed-logs: true
benchmark-extended: true
retries: 1
slurm-requeue: false
printshellcmds: true
latency-wait: 60
