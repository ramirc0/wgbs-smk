# The QC report's env. Its own workspace, because any change to ../pixi.toml or
# its lock reruns every analysis rule.
[workspace]
name = "wgbs-smk-report"
channels = ["conda-forge"]
platforms = ["linux-64"]
exclude-newer = "7d"

[dependencies]
python = "3.14.*"

[pypi-dependencies]
qc-report = { git = "https://github.com/ramirc0/qc-report", tag = "v0.1.0" }

[exclude-newer]
ca-certificates = "0d"
certifi = "0d"
pip = "0d"

[pypi-exclude-newer]
certifi = "0d"
pip = "0d"
