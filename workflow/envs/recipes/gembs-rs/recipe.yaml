# bs_call 3.1.2, mextr 2.1.0 and read_filter from gemBS-rs dev, where its
# maintenance happens; master last changed in 2022. None is packaged on conda.
context:
  version: "4.4.4"
  rev: baf6056faf2c1a4adcaf37e0a840f73249927b74

package:
  name: gembs-rs
  version: ${{ version }}

source:
  git: https://github.com/heathsc/gemBS-rs.git
  rev: ${{ rev }}
  # mextr writes 0-based region ends into strings htslib parses as 1-based,
  # dropping each contig's last base. Not reported upstream.
  patches:
    - mextr-region-ends.patch

build:
  number: 1
  script:
    - cd rust
    # The upstream Makefile generates this manifest. Cargo needs it to load the workspace.
    - cp gemBS/Cargo.toml.in gemBS/Cargo.toml
    # r_htslib links -lhts. Upstream passes -L the same way.
    - export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="$CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS -L $PREFIX/lib"
    # pixi-build reuses the host prefix on a rebuild. --force overwrites the old binaries.
    - cargo install --locked --no-track --force --root "$PREFIX" --path bs_call
    - cargo install --locked --no-track --force --root "$PREFIX" --path mextr
    - cargo install --locked --no-track --force --root "$PREFIX" --path read_filter

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
  host:
    - htslib
    - zlib

about:
  homepage: https://github.com/heathsc/gemBS-rs
  license: BSD-3-Clause
  summary: bs_call, mextr and read_filter from gemBS-rs dev.
