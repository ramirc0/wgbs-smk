# The gembs branch commit that gemBS-rs pins as its c_tools/gem3-mapper
# submodule, on both its master and dev branches. Its alignment code matches
# master's; its CLI has gemBS's --bisulfite-conversion option.
context:
  version: "3.6.0"
  rev: 882b0d80953fb1ec6a2f97268b56ec7aac46e4bc

package:
  name: gem3-mapper
  version: ${{ version }}.gembs

source:
  git: https://github.com/smarco/gem3-mapper.git
  rev: ${{ rev }}

build:
  number: 0
  script:
    - sed -i.bak "/^PATH_INCLUDE=/ s@\$@ -I$PREFIX/include@; /^PATH_LIB=/ s@\$@ -L$PREFIX/lib@" Makefile.mk.in
    - export CC="$CC -fcommon"
    - ./configure --enable-cuda=no
    # The Docker image's flags. Binaries need AVX-512 (the SLURM profile's cascadelake constraint).
    - make AR="$AR" FLAGS_OPT="-O3 -march=x86-64-v4"
    - install -d "$PREFIX/bin"
    - install -m 0755 bin/gem-indexer bin/gem-mapper bin/gem-retriever "$PREFIX/bin/"

requirements:
  build:
    - ${{ compiler('c') }}
    - make
  host:
    - bzip2
    - zlib

about:
  homepage: https://github.com/smarco/gem3-mapper
  license: GPL-3.0-only
  summary: The GEM read mapper (v3), from the gembs branch that gemBS-rs uses.
