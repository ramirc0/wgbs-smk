[workspace]
name = "wgbs-smk-envs"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[dependencies]
python = "3.12.*"
polars = "1.*"
pysam = "*"
samtools = "*"
bcftools = "*"
htslib = "*"
bedtools = "*"
seqkit = "2.11.0.*"
pigz = "*"
parallel = "*"
ucsc-bedgraphtobigwig = "*"
gem3-mapper = { path = "recipes/gem3-mapper", package.build.backend = { name = "pixi-build-rattler-build", version = "==0.4.7" } }
gembs-rs = { path = "recipes/gembs-rs", package.build.backend = { name = "pixi-build-rattler-build", version = "==0.4.7" } }

[pypi-dependencies]
qc-utils = "*"

[feature.test.dependencies]
pytest = "*"

[environments]
test = { features = ["test"] }
