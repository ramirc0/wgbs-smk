[workspace]
name = "wgbs-smk-envs"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[dependencies]
python = "3.14.*"
polars = "2.*"
pybigwig = "*"
samtools = "*"
bcftools = "*"
htslib = "*"
bedtools = "*"
seqkit = "2.14.*"
pigz = "*"
parallel = "*"
gem3-mapper = { path = "recipes/gem3-mapper", package.build.backend = { name = "pixi-build-rattler-build", version = "==0.4.7" } }
gembs-rs = { path = "recipes/gembs-rs", package.build.backend = { name = "pixi-build-rattler-build", version = "==0.4.7" } }
minibwa = { path = "recipes/minibwa", package.build.backend = { name = "pixi-build-rattler-build", version = "==0.4.7" } }
bigtools = "*"
bwa-mem3 = "0.14.*"

[feature.test.dependencies]
pytest = "*"

[environments]
test = { features = ["test"] }
